<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opalin - Private Media Vault</title>
    <meta name="description" content="Private media vault for Opalin.">
    <link rel="icon" type="image/png" href="assets/logoO.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <!-- Configure this once your domain is live: https://plausible.io -->
    <!-- <script defer data-domain="your-domain.com" src="https://plausible.io/js/script.js"></script> -->

        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-RYR98ET091"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-RYR98ET091');
        </script>
</head>
<body class="secret-page">
    <header>
        <div class="container header-container">
            <div class="logo">
                <img src="assets/OpalinLogoExploded.png" alt="Opalin" class="logo-image">
            </div>
            <nav>
                <a href="index.html" class="btn-outline">Back to site</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="secret-gate-section">
            <div class="container">
                <div class="secret-gate-card" id="gateCard">
                    <p class="secret-eyebrow">Private access</p>
                    <h1 class="secret-title">Media Vault</h1>
                    <p class="secret-subtitle">Enter your password to open private videos and images.</p>

                    <form id="unlockForm" class="unlock-form" autocomplete="off">
                        <label for="vaultPassword" class="unlock-label">Password</label>
                        <div class="unlock-row">
                            <input id="vaultPassword" name="vaultPassword" type="password" class="unlock-input" required>
                            <button type="submit" class="btn-primary">Unlock</button>
                        </div>
                        <p id="gateMessage" class="gate-message" aria-live="polite"></p>
                    </form>

                    <p class="secret-note">Important: this is a client-side gate. For stronger protection, deploy this page behind Cloudflare Access or an authenticated backend.</p>
                </div>
            </div>
        </section>

        <section class="secret-content" id="secretContent" hidden>
            <div class="container">
                <div class="secret-content-header">
                    <div>
                        <p class="secret-eyebrow">Unlocked</p>
                        <h2>Private Media</h2>
                    </div>
                    <button id="lockButton" class="btn-outline" type="button">Lock</button>
                </div>

                <div id="mediaGrid" class="media-grid"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Opalin. Private content.</p>
        </div>
    </footer>

    <script>
        const SECRET_HASH = 'fffab8e1c749dd2c723079c1b25e175e88b501834c1691deee79daeb25de710c';
        const SESSION_KEY = 'opalin_vault_access';

        const unlockForm = document.getElementById('unlockForm');
        const gateMessage = document.getElementById('gateMessage');
        const gateCard = document.getElementById('gateCard');
        const secretContent = document.getElementById('secretContent');
        const lockButton = document.getElementById('lockButton');
        const mediaGrid = document.getElementById('mediaGrid');

        function trackEvent(eventName, props) {
            if (typeof window.plausible === 'function') {
                window.plausible(eventName, props ? { props } : undefined);
            }
            if (typeof window.gtag === 'function') {
                window.gtag('event', eventName, props || {});
            }
        }

        async function sha256(input) {
            const encoder = new TextEncoder();
            const data = encoder.encode(input);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
        }

        function showGateMessage(message, isError) {
            gateMessage.textContent = message;
            gateMessage.classList.toggle('error', Boolean(isError));
        }

        function setUnlockedState(isUnlocked) {
            gateCard.hidden = isUnlocked;
            secretContent.hidden = !isUnlocked;
        }

        async function renderMedia() {
            try {
                const response = await fetch('secret-media.json', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('Unable to read secret-media.json');
                }

                const items = await response.json();
                mediaGrid.innerHTML = '';

                if (!Array.isArray(items) || items.length === 0) {
                    mediaGrid.innerHTML = '<p class="media-empty">No media configured yet. Add items in secret-media.json.</p>';
                    return;
                }

                items.forEach((item) => {
                    const card = document.createElement('article');
                    card.className = 'media-card';

                    const title = item.title || 'Untitled media';
                    const category = item.category || '';
                    const about = item.about || '';

                    if (item.type === 'video') {
                        const video = document.createElement('video');
                        video.controls = true;
                        video.preload = 'metadata';
                        video.src = item.src;
                        if (item.poster) {
                            video.poster = item.poster;
                        }
                        video.addEventListener('play', () => trackEvent('secret_media_play', { id: item.id || title }));
                        card.appendChild(video);
                    } else {
                        const image = document.createElement('img');
                        image.src = item.src;
                        image.alt = title;
                        image.loading = 'lazy';
                        image.addEventListener('click', () => trackEvent('secret_media_view', { id: item.id || title }));
                        card.appendChild(image);
                    }

                    const meta = document.createElement('div');
                    meta.className = 'media-meta';

                    if (category) {
                        const categoryTag = document.createElement('span');
                        categoryTag.className = 'media-category';
                        categoryTag.textContent = category;
                        meta.appendChild(categoryTag);
                    }

                    const heading = document.createElement('h3');
                    heading.textContent = title;
                    meta.appendChild(heading);

                    if (about) {
                        const aboutText = document.createElement('p');
                        aboutText.textContent = about;
                        meta.appendChild(aboutText);
                    }

                    card.appendChild(meta);

                    mediaGrid.appendChild(card);
                });
            } catch (error) {
                mediaGrid.innerHTML = '<p class="media-empty">Failed to load media list. Check secret-media.json.</p>';
            }
        }

        async function unlock(password) {
            const hashedPassword = await sha256(password);
            if (hashedPassword !== SECRET_HASH) {
                showGateMessage('Wrong password.', true);
                trackEvent('secret_unlock_failed');
                return;
            }

            sessionStorage.setItem(SESSION_KEY, String(Date.now()));
            setUnlockedState(true);
            showGateMessage('');
            await renderMedia();
            trackEvent('secret_unlock_success');
        }

        unlockForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new FormData(unlockForm);
            const password = String(formData.get('vaultPassword') || '').trim();
            if (!password) {
                showGateMessage('Enter a password first.', true);
                return;
            }
            await unlock(password);
            unlockForm.reset();
        });

        lockButton.addEventListener('click', () => {
            sessionStorage.removeItem(SESSION_KEY);
            setUnlockedState(false);
            showGateMessage('Vault locked.');
            trackEvent('secret_locked');
        });

        if (sessionStorage.getItem(SESSION_KEY)) {
            setUnlockedState(true);
            renderMedia();
            trackEvent('secret_session_resume');
        } else {
            setUnlockedState(false);
        }
    </script>
</body>
</html>
